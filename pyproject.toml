[project]
name = "nextcloud-talk-hermes-bridge"
version = "1.0.7"
description = "Webhook bridge that connects Nextcloud Talk bots to Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nextcloud Talk Hermes Bridge contributors"}]
keywords = ["nextcloud", "talk", "hermes-agent", "chatbot", "bridge"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[tool.setuptools.packages.find]
include = ["nextcloud_talk_hermes_bridge*", "hermes_plugins*"]
exclude = ["systemd*"]

[tool.setuptools.package-data]
"hermes_plugins.nextcloud_talk" = ["plugin.yaml"]

[project.scripts]
nextcloud-talk-hermes-bridge = "nextcloud_talk_hermes_bridge.bridge:main"
nextcloud-talk-hermes-cron-install = "nextcloud_talk_hermes_bridge.hermes_cron_install:main"

[tool.ruff]
line-length = 120
